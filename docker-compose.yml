services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      FAHAM_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
  web:
    image: nginx:alpine
    ports: ["${WEB_PORT:-8080}:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
