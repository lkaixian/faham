# Real client address: Cloudflare puts it in CF-Connecting-IP; direct visits fall back to the socket address.
map $http_cf_connecting_ip $client_ip { default $http_cf_connecting_ip; "" $remote_addr; }
# Per-client cap on API calls (analysis and voice cost real money once the site is public).
limit_req_zone $client_ip zone=faham_api:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every page except /embed.html: nobody may frame it.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri.html $uri/ =404;   # /terms serves terms.html
        # Pages, scripts and styles are re-checked on every visit (a quick 304 when nothing changed), so a browser
        # never pairs a new page with an old script. "expires -1" sets Cache-Control: no-cache without touching the security headers.
        expires -1;
    }

    # Same-origin API: the page calls /api/... on whatever address it was opened from (localhost, LAN or a tunnel).
    # The variable makes nginx look up "api" again after the container is rebuilt.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $api_upstream http://api:8000;
        limit_req zone=faham_api burst=20 nodelay;
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass $api_upstream;
    }

    # /embed.html is the one page partner sites may put in an <iframe>.
    # To allow a partner, add its origin to the list after 'self', separated by spaces, for example:
    #     set $embed_ancestors "'self' https://www.partner.gov.my https://partner.example.org";
    # Use full origins (scheme and host). Wildcards such as https://*.example.org work too.
    # The checker calls the API from this site's own origin, so the backend CORS list does not change.
    # X-Frame-Options is left out here on purpose: browsers would let it override frame-ancestors.
    # nginx drops server-level add_header lines inside a location that has its own, so the rest are repeated.
    location = /embed.html {
        set $embed_ancestors "'self'";
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-ancestors $embed_ancestors; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
