server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every page except /embed.html: nobody may frame it.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / { try_files $uri $uri/ =404; }

    # /embed.html is the one page partner sites may put in an <iframe>.
    # To allow a partner, add its origin to the list after 'self', separated by spaces, for example:
    #     set $embed_ancestors "'self' https://www.partner.gov.my https://partner.example.org";
    # Use full origins (scheme and host). Wildcards such as https://*.example.org work too.
    # The checker calls the API from this site's own origin, so the backend CORS list does not change.
    # X-Frame-Options is left out here on purpose: browsers would let it override frame-ancestors.
    # nginx drops server-level add_header lines inside a location that has its own, so the rest are repeated.
    location = /embed.html {
        set $embed_ancestors "'self'";
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-ancestors $embed_ancestors; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
