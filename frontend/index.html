<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAHAM</title>
  <meta name="description" content="Tampal surat, SMS atau WhatsApp yang merisaukan. FAHAM cari tanda penipuan dan tunjuk apa yang perlu dibuat, dalam BM, English, 中文 atau தமிழ்." />
  <meta name="theme-color" content="#0b5c63" />
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="assets/img/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="assets/img/favicon-256.png" type="image/png" sizes="256x256" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="#check"><img class="logo logo-l" src="assets/img/logo-mark-light.png" alt="" width="31" height="40" /><img class="logo logo-d" src="assets/img/logo-mark-dark.png" alt="" width="31" height="40" /><span>FAHAM</span></a>
      <div class="ctrls">
        <div class="chips uilang" id="uiChips" role="group" data-i18n-aria="ui_lang"></div>
        <button class="btn btn-quiet" id="themeBtn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
          <span id="themeLbl"></span>
        </button>
        <button class="btn btn-quiet" id="voiceBtn" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
          <span id="voiceLbl"></span>
        </button>
      </div>
      <span class="mode" id="mode" role="status"></span>
    </div>
    <nav class="wrap" data-i18n-aria="nav_label">
      <a href="#check" data-i18n="nav_check"></a>
      <a href="#practice" data-i18n="nav_practice"></a>
      <a href="#dictionary" data-i18n="nav_dict"></a>
      <a href="#family" data-i18n="nav_family"></a>
      <a href="#connect" data-i18n="nav_connect"></a>
      <a href="#about" data-i18n="nav_about"></a>
    </nav>
  </header>

  <main class="wrap" id="main" tabindex="-1">

    <!-- ===== CHECK ===== -->
    <section class="view" id="view-check">
      <div id="checker">
        <h1 tabindex="-1" data-i18n="c_h1"></h1>
        <p class="lead" data-i18n="c_lead"></p>

        <div class="note warn" id="offlineNote" hidden><b data-i18n="off_b"></b> <span data-i18n="off_t"></span></div>

        <ol class="hint" id="hint">
          <li data-i18n="hint1"></li>
          <li data-i18n="hint2"></li>
          <li data-i18n="hint3"></li>
        </ol>

        <form id="form" class="card" novalidate>
          <label for="pasteBox" data-i18n="f_paste"></label>
          <textarea id="pasteBox" rows="7" maxlength="20000" aria-describedby="vhint cnt" data-i18n-ph="f_ph"></textarea>
          <div class="meta"><span class="vh" id="vhint" role="status"></span><span class="cnt" id="cnt"></span></div>
          <p class="muted priv"><span data-i18n="f_priv"></span> <a href="#about" data-i18n="f_priv_a"></a></p>

          <!-- UPLOAD_START -->
          <span class="label" id="upLbl" data-i18n="f_file"></span>
          <div class="drop" id="drop" role="group" aria-labelledby="upLbl">
            <div class="upbtns">
              <button class="btn btn-secondary" id="chooseBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 15v5h16v-5"/></svg><span data-i18n="u_choose"></span></button>
              <button class="btn btn-secondary photo-btn" id="photoBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="u_photo"></span></button>
            </div>
            <p class="muted dropnote" data-i18n="u_drop"></p>
            <p class="muted" id="upTypes"></p>
            <input type="file" id="fileBox" multiple hidden />
            <input type="file" id="photoBox" accept="image/*" capture="environment" hidden />
          </div>
          <ul class="files" id="fileList"></ul>
          <!-- UPLOAD_END -->

          <details class="ex" id="exBox">
          <summary data-i18n="ex_sum"></summary>
          <div class="row2">
            <div>
              <span class="label" id="langLbl" data-i18n="f_explain"></span>
              <div class="chips" id="langChips" role="group" aria-labelledby="langLbl"></div>
              <p class="muted" id="detectNote" role="status"></p>
            </div>
            <div>
              <label for="postBox" data-i18n="f_post"></label>
              <input type="text" id="postBox" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5" autocomplete="postal-code" />
            </div>
          </div>
          <span class="label" data-i18n="ex_h"></span>
          <p class="muted" data-i18n="ex_note"></p>
          <div class="examples" id="examples"></div>
          </details>

          <div class="consent" id="consentBlock" hidden>
            <label class="tick"><input type="checkbox" id="consentBox" /><span data-i18n="consent_t"></span></label>
            <details class="more">
              <summary data-i18n="priv_sum"></summary>
              <p data-i18n="priv_p"></p>
            </details>
          </div>

          <div class="errbox">
            <p class="err" id="formErr" role="alert"></p>
            <button class="btn btn-secondary" id="retryBtn" type="button" hidden data-i18n="btn_retry"></button>
          </div>
          <button class="btn btn-primary btn-big" id="checkBtn" type="submit" data-i18n="btn_check"></button>
          <button class="btn btn-quiet" id="clearInput" type="button" data-i18n="btn_clear"></button>
        </form>

        <div class="busy" id="busy" hidden>
          <p id="busyTxt" role="status"></p>
          <ol class="stages" id="stages" aria-hidden="true"></ol>
        </div>

      </div>

      <!-- result -->
      <div id="result" hidden></div>
    </section>

    <!-- ===== PRACTICE ===== -->
    <section class="view" id="view-practice" hidden>
      <h1 tabindex="-1" data-i18n="p_h1"></h1>
      <p class="lead" data-i18n="p_lead"></p>
      <div class="card">
        <p class="muted" id="pCount" role="status"></p>
        <div class="sms" id="pCard" lang="ms"></div>
        <div class="choices" id="pChoices">
          <button class="btn btn-secondary btn-big" type="button" data-a="legit" data-i18n="p_real"></button>
          <button class="btn btn-secondary btn-big" type="button" data-a="scam" data-i18n="p_scam"></button>
        </div>
        <div id="pFeedback" aria-live="polite"></div>
      </div>
      <div class="card">
        <p><b id="pScore">0 / 0</b> <span data-i18n="p_round"></span></p>
        <button class="btn btn-quiet" id="pRestart" type="button" data-i18n="p_new"></button>
      </div>
    </section>

    <!-- ===== DICTIONARY ===== -->
    <section class="view" id="view-dictionary" hidden>
      <h1 tabindex="-1" data-i18n="d_h1"></h1>
      <p class="lead" data-i18n="d_lead"></p>
      <div class="card">
        <h2 class="h3"><span data-i18n="d_level"></span> <span id="lvlName"></span></h2>
        <div class="bar-track" aria-hidden="true"><i id="lvlBar"></i></div>
        <p class="muted" id="lvlNext"></p>
        <p class="muted" data-i18n="d_earn"></p>
      </div>
      <label for="glossSearch" data-i18n="d_search"></label>
      <input type="search" id="glossSearch" data-i18n-ph="d_ph" />
      <p class="muted" id="glossCount" role="status"></p>
      <div id="glossGrid" class="gloss"></div>
    </section>

    <!-- ===== FAMILY ===== -->
    <section class="view" id="view-family" hidden>
      <h1 tabindex="-1" data-i18n="fa_h1"></h1>
      <p class="lead" data-i18n="fa_lead"></p>
      <div class="note"><b data-i18n="fa_note_b"></b> <span data-i18n="fa_note"></span></div>
      <div class="card">
        <label for="fLetter" data-i18n="fa_letter"></label>
        <select id="fLetter"></select>
        <label for="fLang" data-i18n="fa_lang"></label>
        <select id="fLang"></select>
        <p class="muted" id="fNote"></p>
        <h2 class="h3" data-i18n="fa_msg_h"></h2>
        <div class="msg" id="fMsg" lang="ms"></div>
        <button class="btn btn-primary" id="fCopy" type="button"><span data-i18n="fa_copy"></span></button>
        <button class="btn btn-secondary speak" id="fSpeak" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span></span></button>
        <p class="muted" id="fVnote" role="status"></p>
      </div>
    </section>

    <!-- ===== CONNECT ===== -->
    <section class="view" id="view-connect" hidden>
      <h1 tabindex="-1" data-i18n="cn_h1"></h1>
      <p class="lead" data-i18n="cn_lead"></p>
      <div id="connectBody"></div>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="view" id="view-about" hidden>
      <h1 tabindex="-1" data-i18n="a_h1"></h1>
      <p class="note warn" id="aboutReview" hidden data-i18n="a_review"></p>

      <h2 data-i18n="a_do_h"></h2>
      <p data-i18n="a_do_p"></p>

      <h2 data-i18n="a_cant_h"></h2>
      <ul>
        <li data-i18n="a_cant1"></li>
        <li data-i18n="a_cant2"></li>
        <li data-i18n="a_cant3"></li>
        <li data-i18n="a_cant4"></li>
      </ul>

      <h2 data-i18n="a_how_h"></h2>
      <p data-i18n="a_how_p"></p>
      <p><b data-i18n="a_signs_b"></b></p>
      <ul>
        <li data-i18n="a_sg1"></li>
        <li data-i18n="a_sg2"></li>
        <li data-i18n="a_sg3"></li>
        <li data-i18n="a_sg4"></li>
        <li data-i18n="a_sg5"></li>
        <li data-i18n="a_sg6"></li>
      </ul>
      <p data-i18n="a_three"></p>
      <p data-i18n="a_limits"></p>

      <h2 data-i18n="a_data_h"></h2>
      <ul>
        <li data-i18n="a_dt1"></li>
        <li data-i18n="a_dt2"></li>
        <li data-i18n="a_dt3"></li>
        <li data-i18n="a_dt4"></li>
        <li data-i18n="a_dt5"></li>
        <li data-i18n="a_dt7"></li>
      </ul>
      <button class="btn btn-secondary" id="clearData" type="button" data-i18n="a_clear"></button>
      <button class="btn btn-quiet" id="obAgain" type="button" data-i18n="ob_again"></button>
      <p class="muted" id="clearMsg" role="status"></p>

      <h2 data-i18n="a_guid_h"></h2>
      <p data-i18n="a_guid_p"></p>

      <div class="note bad">
        <b data-i18n="a_paid_b"></b> <span data-i18n="a_paid"></span> <a href="tel:997">997</a>.
      </div>
    </section>
  </main>

  <footer class="wrap foot">
    <p><span data-i18n="foot_scam"></span> <a href="tel:997">NSRC 997</a>.</p>
    <p data-i18n="foot_disc"></p>
  </footer>
  <div class="ob" id="ob" role="dialog" aria-modal="true" aria-labelledby="obH" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
