services:
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]   # local only; the public path is web -> /api/
    env_file:
      - path: ./.env                  # the one settings file, also read by compose itself
        required: false
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ""     # the API never needs the tunnel token; keep it out of that container
      FAHAM_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
  web:
    image: nginx:alpine
    ports: ["${WEB_PORT:-8080}:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  # Public access with Cloudflare Tunnel. Not started by default; see README "Public access".
  # Named tunnel (your own hostname):   docker compose --profile tunnel up -d
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on: [web]
  # Quick tunnel (no account, random https://....trycloudflare.com, for a short demo):
  #   docker compose --profile quick up -d quicktunnel && docker compose logs quicktunnel
  quicktunnel:
    profiles: ["quick"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]
