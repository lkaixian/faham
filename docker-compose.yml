services:
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]   # local only; the public path is web -> /api/
    env_file:
      - path: ./.env                  # the one settings file, also read by compose itself
        required: false
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ""     # the API never needs the tunnel token; keep it out of that container
      FAHAM_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
    # Hardening: the API reads hostile files (see backend/app/sandbox.py). It cannot write outside RAM-backed /tmp and /app/var,
    # has no extra Linux capabilities, and is capped in memory and process count.
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 200
  web:
    image: nginx:alpine
    ports: ["${WEB_PORT:-8080}:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    # Hardening: nothing writes outside RAM-backed directories; only the capabilities nginx needs to start and drop to its worker user.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    depends_on: [api]

  # Public access with Cloudflare Tunnel. Not started by default; see README "Public access".
  # Named tunnel (your own hostname):   docker compose --profile tunnel up -d
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on: [web]
  # Quick tunnel (no account, random https://....trycloudflare.com, for a short demo):
  #   docker compose --profile quick up -d quicktunnel && docker compose logs quicktunnel
  quicktunnel:
    profiles: ["quick"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]
